[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-gas"
description = "Parses GNU Assembler (as) syntax."
version = "0.0.1"
keywords = ["incremental", "parsing", "tree-sitter", "gas"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Cyrill Schenkel", email = "cyrill.schenkel@gmail.com" }]
requires-python = ">=3.10"
license.text = "GPLv3"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/sirius94/tree-sitter-gas"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
